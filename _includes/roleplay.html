<div class="roleplay-box" data-roleplay hidden lang="en">
  <h3>Reply one turn at a time</h3>
  <p>
    Say your reply aloud, then continue. This is a scripted practice partner; it does not listen to or assess your
    reply.
  </p>
  <p data-turn-count class="small-note"></p>
  <p class="roleplay-turn" tabindex="-1" lang="en" aria-live="polite"></p>
  <p class="roleplay-sample" lang="en" hidden></p>
  <div class="roleplay-controls">
    <button class="button secondary" data-turn-hint type="button">One hint</button
    ><button class="button primary" data-turn-next type="button">I’ve replied →</button>
  </div>
  <script type="application/json">
    {{ page.turns | jsonify }}
  </script>
</div>
<details class="partner-turns">
  <summary>Partner-only turns — practice without the model</summary>
  <ol>
    {% for turn in page.turns %}
      <li>{{ turn.prompt }}</li>
    {% endfor %}
  </ol>
</details>
