<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {{ page.title | escape }}
      · Daily English
    </title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Daily English — Trang chủ"
        ><span class="brand-icon" aria-hidden="true">d<span>e</span></span
        >Daily English<span class="brand-dot">.</span></a
      >
      <nav aria-label="Điều hướng chính">
        <a
          href="{{ '/' | relative_url }}"
          {% if page.layout == 'home' %}
            aria-current="page"
          {% endif %}
          >Hôm nay</a
        >
        <a
          href="{{ '/lessons/' | relative_url }}"
          {% if page.url contains '/lessons/' %}
            aria-current="page"
          {% endif %}
          >Bài học</a
        >
        <a
          href="{{ '/phrases/' | relative_url }}"
          {% if page.url contains '/phrases/' %}
            aria-current="page"
          {% endif %}
          >Câu thường dùng</a
        >
        <a
          href="{{ '/docs/start-here.html' | relative_url }}"
          {% if page.url contains '/docs/' %}
            aria-current="page"
          {% endif %}
          >Cách học</a
        >
      </nav>
      <span class="header-note">Một chút mỗi ngày.</span>
    </header>
    <main
      id="main"
      class="site-main {% if page.layout == 'home' %}home-main{% elsif page.layout == 'lesson' %}lesson-main{% else %}document-main{% endif %}"
    >
      {% if page.layout == 'default' %}
        <article class="prose">{{ content }}</article>
      {% else -%}
        {{- content -}}
      {%- endif %}
    </main>
    <footer class="site-footer">
      <span>Daily English · Học ít. Nói nhiều. Nhớ lâu hơn.</span
      ><a href="{{ '/docs/review-and-mastery.html' | relative_url }}">Cách ôn &amp; lưu tiến độ</a>
    </footer>
    {% include lesson-data.html %}
  </body>
</html>
